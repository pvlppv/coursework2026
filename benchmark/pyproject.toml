[project]
name = "sotie-benchmark"
version = "1.0.0"
description = "Reproducible LLM benchmark for Sotie Go Deeper (HSE coursework 2026, §5)."
authors = [{name = "Popov Pavel Glebovich", email = "polinella0@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.4.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.scripts]
sotie-bench = "benchmark.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
