name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd /root/sotie
            git pull --ff-only origin main
            cd backend
            docker compose -f docker-compose.prod.yml up -d --build
            for attempt in $(seq 1 30); do
              if curl -fsS https://sotie.app/health; then
                break
              fi

              if [ "$attempt" -eq 30 ]; then
                docker compose -f docker-compose.prod.yml ps
                docker logs --tail 120 sotie-backend-api || true
                exit 1
              fi

              sleep 2
            done
            node --input-type=module - <<'NODE'
            const base = 'https://sotie.app';
            const sessionRes = await fetch(`${base}/v1/session`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: '{}',
            });
            if (!sessionRes.ok) {
              throw new Error(`session failed: ${sessionRes.status}`);
            }

            const session = await sessionRes.json();
            if (!session.token) {
              throw new Error('session response did not include token');
            }

            const meRes = await fetch(`${base}/v1/me`, {
              headers: { authorization: `Bearer ${session.token}` },
            });
            if (!meRes.ok) {
              throw new Error(`me failed: ${meRes.status}`);
            }

            const me = await meRes.json();
            if (!me.session || !me.entitlement) {
              throw new Error('me response did not include session and entitlement');
            }
            NODE
